[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ten-minutes-backend"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "alembic==1.14.0",
  "anyio>=4,<5",
  "fastapi==0.115.6",
  "google-auth[requests]>=2.40,<3",
  "httpx==0.28.1",
  "pydantic-settings==2.7.1",
  "psycopg[binary]==3.2.13",
  "SQLAlchemy==2.0.36",
  "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "postgresql: requires TEST_DATABASE_URL and a migrated PostgreSQL database",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.md", "prompts/*.json"]

[tool.vercel]
entrypoint = "app.main:app"
